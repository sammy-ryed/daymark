name: Web and API checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --workspace @project/web --workspace @project/api --include-workspace-root
      - run: npm run typecheck -w @project/api && npm run typecheck -w @project/web
      - run: npm test
      - run: npm run build
